<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Reset Password | Smart Work Network</title>

  <link
    rel="stylesheet"
    href="css/main.css"
  >
</head>

<body>

<header class="header">

  <div class="container nav">

    <a
      class="brand"
      href="index.html"
    >
      Smart Work Network
    </a>

  </div>

</header>

<main>

  <section class="section">

    <div
      class="container"
      style="max-width:560px"
    >

      <div class="card">

        <h1>
          Create New Password
        </h1>

        <p>
          Enter your new password below.
        </p>

        <form
          class="form"
          id="resetPasswordForm"
        >

          <label>
            New Password

            <input
              id="newPassword"
              name="newPassword"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
            >
          </label>

          <label>
            Confirm Password

            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
            >
          </label>

          <button
            type="submit"
            class="btn btn-primary"
            id="resetButton"
          >
            Reset Password
          </button>

        </form>

        <p
          id="resetMessage"
          role="status"
          aria-live="polite"
        ></p>

      </div>

    </div>

  </section>

</main>

<footer class="footer">

  <div class="container">

    <b>
      Smart Work Network
    </b>

  </div>

</footer>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>

<script>
"use strict";

const form =
  document.getElementById(
    "resetPasswordForm"
  );

const button =
  document.getElementById(
    "resetButton"
  );

const message =
  document.getElementById(
    "resetMessage"
  );

const resetToken =
  sessionStorage.getItem(
    "swn_reset_token"
  );

function showMessage(
  text
) {
  message.textContent =
    String(
      text || ""
    );
}

if (!resetToken) {
  showMessage(
    "Password reset authorization is missing or expired. Please request a new OTP."
  );

  button.disabled =
    true;
}

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    if (!resetToken) {
      showMessage(
        "Please request a new password reset OTP."
      );

      return;
    }

    const newPassword =
      String(
        document.getElementById(
          "newPassword"
        ).value || ""
      );

    const confirmPassword =
      String(
        document.getElementById(
          "confirmPassword"
        ).value || ""
      );

    if (
      newPassword.length < 8
    ) {
      showMessage(
        "Password must be at least 8 characters."
      );

      return;
    }

    if (
      newPassword.length > 128
    ) {
      showMessage(
        "Password must not exceed 128 characters."
      );

      return;
    }

    if (
      newPassword !==
      confirmPassword
    ) {
      showMessage(
        "Passwords do not match."
      );

      return;
    }

    button.disabled =
      true;

    button.textContent =
      "Resetting...";

    try {
      const result =
        await SWN.request(
          "/auth/reset-password",
          {
            method: "POST",

            body:
              JSON.stringify({
                resetToken,
                newPassword,
                confirmPassword
              })
          }
        );

      if (
        !result ||
        !result.success
      ) {
        showMessage(
          result?.message ||
            "Unable to reset password."
        );

        return;
      }

      sessionStorage.removeItem(
        "swn_reset_token"
      );

      if (
        result.user
      ) {
        localStorage.setItem(
          "swn_user",
          JSON.stringify(
            result.user
          )
        );

        window.location.href =
          result.user.role ===
          "worker"
            ? "worker-dashboard.html"
            : "customer-dashboard.html";

        return;
      }

      window.location.href =
        "login.html";
    } catch (error) {
      console.error(
        "RESET PASSWORD ERROR:",
        error
      );

      showMessage(
        error.message ||
          "Unable to reset password."
      );
    } finally {
      button.disabled =
        false;

      button.textContent =
        "Reset Password";
    }
  }
);
</script>

</body>
</html>
