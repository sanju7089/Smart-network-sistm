<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Reset Password | Smart Work Network</title>

  <link
    rel="stylesheet"
    href="css/main.css"
  >
</head>

<body>

  <header class="header">

    <div class="container nav">

      <a
        class="brand"
        href="index.html"
      >
        Smart Work Network
      </a>

      <nav class="navlinks">

        <a href="services.html">
          Services
        </a>

        <a href="find-help.html">
          Find Help
        </a>

        <a href="workers.html">
          Workers
        </a>

        <span data-auth></span>

      </nav>

    </div>

  </header>


  <main>

    <section class="section">

      <div
        class="container"
        style="max-width: 560px"
      >

        <div class="card">

          <h1>Reset Password</h1>

          <p>
            Create a new password for your
            Smart Work Network account.
          </p>


          <form
            class="form"
            id="resetPasswordForm"
          >

            <label>
              New Password

              <input
                name="password"
                id="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                maxlength="128"
                placeholder="Enter new password"
              >

            </label>


            <label>
              Confirm New Password

              <input
                name="confirmPassword"
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                maxlength="128"
                placeholder="Confirm new password"
              >

            </label>


            <button
              type="submit"
              class="btn btn-primary"
              id="resetPasswordButton"
            >
              Reset Password
            </button>

          </form>


          <p
            id="resetPasswordMessage"
            role="status"
            aria-live="polite"
          ></p>


          <p>
            <a href="login.html">
              Back to Login
            </a>
          </p>

        </div>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <b>Smart Work Network</b>

      <p>
        Services • Workers • Work opportunities
      </p>

      <div class="row">

        <a href="support.html">
          Support
        </a>

        <a href="profile.html">
          Profile
        </a>

        <a href="urgent-help.html">
          Urgent Help
        </a>

      </div>

    </div>

  </footer>


  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>


  <script>

    "use strict";


    const form =
      document.getElementById(
        "resetPasswordForm"
      );

    const button =
      document.getElementById(
        "resetPasswordButton"
      );

    const message =
      document.getElementById(
        "resetPasswordMessage"
      );

    const password =
      document.getElementById(
        "password"
      );

    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const token =
      String(
        params.get("token") || ""
      )
        .trim();


    function showResetMessage(text) {

      message.textContent =
        String(text || "");

    }


    function validResetToken(value) {

      return /^[a-f0-9]{64}$/i.test(
        value
      );

    }


    if (!validResetToken(token)) {

      button.disabled = true;

      showResetMessage(
        "This password reset link is invalid or incomplete. Please request a new reset link."
      );

    }


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        if (!validResetToken(token)) {

          showResetMessage(
            "This reset link is invalid or expired. Please request a new one."
          );

          return;

        }


        const newPassword =
          String(
            password.value || ""
          );


        const confirm =
          String(
            confirmPassword.value || ""
          );


        if (
          newPassword.length < 8
        ) {

          showResetMessage(
            "Password must be at least 8 characters."
          );

          return;

        }


        if (
          newPassword.length > 128
        ) {

          showResetMessage(
            "Password cannot be longer than 128 characters."
          );

          return;

        }


        if (
          newPassword !== confirm
        ) {

          showResetMessage(
            "Passwords do not match."
          );

          return;

        }


        button.disabled = true;

        button.textContent =
          "Resetting...";


        showResetMessage("");


        try {

          const result =
            await SWN.request(
              "/auth/reset-password",
              {
                method: "POST",

                body:
                  JSON.stringify({
                    token,
                    password:
                      newPassword
                  })
              }
            );


          if (
            !result ||
            !result.success
          ) {

            showResetMessage(
              result?.message ||
              "Unable to reset your password."
            );

            return;

          }


          showResetMessage(
            result.message ||
            "Password reset successfully."
          );


          form.reset();


          /*
           * Backend issues a fresh HttpOnly
           * authentication cookie after reset.
           *
           * Redirect after a short delay so the
           * user can see the success message.
           */

          setTimeout(
            function () {

              window.location.href =
                "login.html";

            },
            1200
          );


        } catch (error) {

          console.error(
            "RESET PASSWORD ERROR:",
            error
          );


          showResetMessage(
            error?.message ||
            "Unable to reset your password. Please request a new reset link."
          );

        } finally {

          button.disabled = false;

          button.textContent =
            "Reset Password";

        }

      }
    );

  </script>

</body>

</html>
