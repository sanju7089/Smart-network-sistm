name: Smart Work Network CI

on:
push:
branches:
- main

pull_request:
branches:
- main

permissions:
contents: read

jobs:
backend-checks:
name: Backend Tests & Checks

runs-on: ubuntu-latest

defaults:
  run:
    working-directory: server

strategy:
  fail-fast: false
  matrix:
    node-version:
      - 20
      - 22

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ matrix.node-version }}

  - name: Install dependencies
    run: npm install

  - name: Check server syntax
    run: node --check server.js

  - name: Check controllers syntax
    shell: bash
    run: |
      set -e
      shopt -s nullglob

      files=(controllers/*.js)

      for file in "${files[@]}"; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check middleware syntax
    shell: bash
    run: |
      set -e
      shopt -s nullglob

      files=(middleware/*.js)

      for file in "${files[@]}"; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check models syntax
    shell: bash
    run: |
      set -e
      shopt -s nullglob

      files=(models/*.js)

      for file in "${files[@]}"; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check routes syntax
    shell: bash
    run: |
      set -e
      shopt -s nullglob

      files=(routes/*.js)

      for file in "${files[@]}"; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check test files syntax
    shell: bash
    run: |
      set -e
      shopt -s globstar nullglob

      files=(tests/**/*.js)

      if [ "${#files[@]}" -eq 0 ]; then
        echo "No test files found."
        exit 1
      fi

      for file in "${files[@]}"; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Run all automated tests
    run: npm test
