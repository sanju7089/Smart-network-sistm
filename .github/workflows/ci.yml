name: Smart Work Network CI

on:
push:
branches:
- main

pull_request:
branches:
- main

permissions:
contents: read

jobs:
backend-checks:
name: Backend Tests & Checks

runs-on: ubuntu-latest

defaults:
  run:
    working-directory: server

strategy:
  fail-fast: false
  matrix:
    node-version:
      - 20
      - 22

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ matrix.node-version }}

  - name: Install dependencies
    run: npm install

  - name: Check server syntax
    run: node --check server.js

  - name: Check controllers syntax
    run: |
      for file in controllers/*.js; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check middleware syntax
    run: |
      for file in middleware/*.js; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check models syntax
    run: |
      for file in models/*.js; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check routes syntax
    run: |
      for file in routes/*.js; do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check test files syntax
    run: |
      for file in tests/**/*.js tests/*.js; do
        if [ -f "$file" ]; then
          echo "Checking $file"
          node --check "$file"
        fi
      done

  - name: Run automated tests
    run: npm test

  - name: Run authentication tests
    run: npm run test:auth

  - name: Run booking tests
    run: npm run test:booking

  - name: Run payment tests
    run: npm run test:payment

  - name: Run API tests
    run: npm run test:api
