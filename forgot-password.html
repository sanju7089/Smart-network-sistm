<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Forgot Password | Smart Work Network</title>

  <link
    rel="stylesheet"
    href="css/main.css"
  >
</head>

<body>

<header class="header">

  <div class="container nav">

    <a
      class="brand"
      href="index.html"
    >
      Smart Work Network
    </a>

    <nav class="navlinks">

      <a href="services.html">
        Services
      </a>

      <a href="find-help.html">
        Find Help
      </a>

      <a href="workers.html">
        Workers
      </a>

      <span data-auth></span>

    </nav>

  </div>

</header>

<main>

  <section class="section">

    <div
      class="container"
      style="max-width:560px"
    >

      <div class="card">

        <h1>
          Forgot Password
        </h1>

        <p>
          Enter your registered email address.
          We will send you a 6-digit OTP.
        </p>

        <form
          class="form"
          id="forgotPasswordForm"
        >

          <label>
            Email

            <input
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="254"
              placeholder="Enter your email"
            >
          </label>

          <button
            type="submit"
            class="btn btn-primary"
            id="forgotPasswordButton"
          >
            Send OTP
          </button>

        </form>

        <p
          id="forgotPasswordMessage"
          role="status"
          aria-live="polite"
        ></p>

        <p>

          Remember your password?

          <a href="login.html">
            Login
          </a>

        </p>

      </div>

    </div>

  </section>

</main>

<footer class="footer">

  <div class="container">

    <b>
      Smart Work Network
    </b>

    <p>
      Services • Workers • Work opportunities
    </p>

    <div class="row">

      <a href="support.html">
        Support
      </a>

      <a href="profile.html">
        Profile
      </a>

      <a href="urgent-help.html">
        Urgent Help
      </a>

    </div>

  </div>

</footer>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>

<script>
"use strict";

const form =
  document.getElementById(
    "forgotPasswordForm"
  );

const button =
  document.getElementById(
    "forgotPasswordButton"
  );

const message =
  document.getElementById(
    "forgotPasswordMessage"
  );

function showForgotMessage(
  text
) {
  message.textContent =
    String(
      text || ""
    );
}

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const formData =
      new FormData(form);

    const email =
      String(
        formData.get(
          "email"
        ) || ""
      )
        .trim()
        .toLowerCase();

    if (
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        email
      )
    ) {
      showForgotMessage(
        "Please enter a valid email address."
      );

      return;
    }

    button.disabled =
      true;

    button.textContent =
      "Sending OTP...";

    showForgotMessage(
      ""
    );

    try {
      const result =
        await SWN.request(
          "/auth/forgot-password",
          {
            method: "POST",

            body:
              JSON.stringify({
                email
              })
          }
        );

      sessionStorage.setItem(
        "swn_pending_reset_email",
        email
      );

      showForgotMessage(
        result?.message ||
          "If an account exists, a password reset OTP has been sent."
      );

      window.location.href =
        `verify-otp.html?mode=reset&email=${encodeURIComponent(
          email
        )}`;
    } catch (error) {
      console.error(
        "FORGOT PASSWORD ERROR:",
        error
      );

      showForgotMessage(
        error.message ||
          "Unable to process your request."
      );
    } finally {
      button.disabled =
        false;

      button.textContent =
        "Send OTP";
    }
  }
);
</script>

</body>
</html>
