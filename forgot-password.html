<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Forgot Password | Smart Work Network</title>

  <link
    rel="stylesheet"
    href="css/main.css"
  >
</head>

<body>

  <header class="header">

    <div class="container nav">

      <a
        class="brand"
        href="index.html"
      >
        Smart Work Network
      </a>

      <nav class="navlinks">

        <a href="services.html">
          Services
        </a>

        <a href="find-help.html">
          Find Help
        </a>

        <a href="workers.html">
          Workers
        </a>

        <span data-auth></span>

      </nav>

    </div>

  </header>


  <main>

    <section class="section">

      <div
        class="container"
        style="max-width: 560px"
      >

        <div class="card">

          <h1>Forgot Password</h1>

          <p>
            Enter your registered email address.
            If an account exists, we will send you
            a password reset link.
          </p>


          <form
            class="form"
            id="forgotPasswordForm"
          >

            <label>
              Email

              <input
                name="email"
                type="email"
                autocomplete="email"
                required
                maxlength="254"
                placeholder="Enter your email"
              >

            </label>


            <button
              type="submit"
              class="btn btn-primary"
              id="forgotPasswordButton"
            >
              Send Reset Link
            </button>

          </form>


          <p
            id="forgotPasswordMessage"
            role="status"
            aria-live="polite"
          ></p>


          <p>

            Remember your password?

            <a href="login.html">
              Login
            </a>

          </p>

        </div>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <b>Smart Work Network</b>

      <p>
        Services • Workers • Work opportunities
      </p>

      <div class="row">

        <a href="support.html">
          Support
        </a>

        <a href="profile.html">
          Profile
        </a>

        <a href="urgent-help.html">
          Urgent Help
        </a>

      </div>

    </div>

  </footer>


  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>


  <script>

    "use strict";


    const form =
      document.getElementById(
        "forgotPasswordForm"
      );

    const button =
      document.getElementById(
        "forgotPasswordButton"
      );

    const message =
      document.getElementById(
        "forgotPasswordMessage"
      );


    function showForgotMessage(text) {

      message.textContent =
        String(text || "");

    }


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const formData =
          new FormData(form);


        const email =
          String(
            formData.get("email") || ""
          )
            .trim()
            .toLowerCase();


        if (!email) {

          showForgotMessage(
            "Please enter your email address."
          );

          return;

        }


        if (
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
          )
        ) {

          showForgotMessage(
            "Please enter a valid email address."
          );

          return;

        }


        button.disabled = true;

        button.textContent =
          "Sending...";


        showForgotMessage("");


        try {

          const result =
            await SWN.request(
              "/auth/forgot-password",
              {
                method: "POST",

                body:
                  JSON.stringify({
                    email
                  })
              }
            );


          /*
           * The backend intentionally returns
           * a generic response so that attackers
           * cannot discover which email addresses
           * have accounts.
           */

          showForgotMessage(
            result?.message ||
            "If an account exists for this email, a password reset link has been sent."
          );


          form.reset();


        } catch (error) {

          console.error(
            "FORGOT PASSWORD ERROR:",
            error
          );


          showForgotMessage(
            error?.message ||
            "Unable to process your request. Please try again later."
          );

        } finally {

          button.disabled = false;

          button.textContent =
            "Send Reset Link";

        }

      }
    );

  </script>

</body>

</html>
