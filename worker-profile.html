  <link

  >  <style>
    .worker-profile-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .worker-profile-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    .worker-profile-grid {
      display: grid;
      grid-template-columns: repeat(
        2,
        minmax(0, 1fr)
      );
      gap: 18px;
    }

    .worker-profile-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .worker-profile-field.full-width {
      grid-column: 1 / -1;
    }

    .worker-profile-field label {
      font-weight: 600;
    }

    .worker-profile-field input,
    .worker-profile-field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #d7dce2;
      border-radius: 10px;
      font: inherit;
      background: #fff;
    }

    .worker-profile-field textarea {
      min-height: 130px;
      resize: vertical;
    }

    .worker-profile-help {
      margin: 0;
      font-size: 13px;
      color: #667085;
    }

    .worker-profile-availability {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      border: 1px solid #d7dce2;
      border-radius: 12px;
      background: #f8fafc;
    }

    .worker-profile-availability-info {
      flex: 1;
    }

    .worker-profile-availability-title {
      margin: 0 0 5px;
      font-weight: 700;
    }

    .worker-profile-availability-text {
      margin: 0;
      font-size: 14px;
      color: #667085;
    }

    .worker-profile-switch {
      position: relative;
      display: inline-flex;
      width: 52px;
      height: 30px;
      flex: 0 0 auto;
    }

    .worker-profile-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .worker-profile-slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #cbd5e1;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .worker-profile-slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 4px;
      top: 4px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .worker-profile-switch input:checked + .worker-profile-slider {
      background: #16a34a;
    }

    .worker-profile-switch input:checked + .worker-profile-slider::before {
      transform: translateX(22px);
    }

    .worker-profile-switch input:focus-visible + .worker-profile-slider {
      outline: 3px solid rgba(59, 130, 246, 0.25);
      outline-offset: 2px;
    }

    .worker-profile-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .worker-profile-actions button,
    .worker-profile-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 10px;
      border: 0;
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    .worker-profile-actions button {
      background: #111827;
      color: #fff;
    }

    .worker-profile-actions button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .worker-profile-actions a {
      background: #eef2f7;
      color: #111827;
    }

    .worker-profile-message {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .worker-profile-message.show {
      display: block;
    }

    .worker-profile-message.success {
      background: #eaf8ef;
      color: #176b35;
    }

    .worker-profile-message.error {
      background: #fff0f0;
      color: #a51d2d;
    }

    .worker-profile-loading,
    .worker-profile-empty {
      text-align: center;
      padding: 40px 20px;
    }

    .worker-profile-detail-row {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #edf0f3;
    }

    .worker-profile-detail-row:last-child {
      border-bottom: 0;
    }

    .worker-profile-detail-label {
      min-width: 150px;
      font-weight: 600;
    }

    .worker-profile-detail-value {
      flex: 1;
      word-break: break-word;
    }

    .worker-profile-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef2f7;
      font-size: 13px;
      font-weight: 600;
    }

    .worker-profile-badge.verified {
      background: #e8f7ed;
      color: #176b35;
    }

    .worker-profile-badge.available {
      background: #e8f7ed;
      color: #176b35;
    }

    .worker-profile-badge.unavailable {
      background: #fff0f0;
      color: #a51d2d;
    }

    .worker-profile-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .worker-profile-skill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef2f7;
      color: #344054;
      font-size: 13px;
      font-weight: 600;
    }

    .worker-profile-error {
      background: #fff0f0;
      color: #a51d2d;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    @media (max-width: 700px) {
      .worker-profile-grid {
        grid-template-columns: 1fr;
      }

      .worker-profile-field.full-width {
        grid-column: auto;
      }

      .worker-profile-availability {
        align-items: flex-start;
      }

      .worker-profile-detail-row {
        flex-direction: column;
        gap: 4px;
      }

      .worker-profile-detail-label {
        min-width: 0;
      }
    }
  </style></head><body>  <main class="worker-profile-page"><div
  id="workerProfileMessage"
  class="worker-profile-message"
  role="alert"
  aria-live="polite"
></div>

<section
  id="workerEditSection"
  class="worker-profile-card"
  hidden
>

  <h1>Edit Worker Profile</h1>

  <p>
    Update your worker information below.
  </p>

  <form
    id="workerProfileForm"
    novalidate
  >

    <div class="worker-profile-grid">

      <div class="worker-profile-field">
        <label for="workerName">
          Name
        </label>

        <input
          id="workerName"
          name="name"
          type="text"
          maxlength="100"
          autocomplete="name"
          required
        >
      </div>

      <div class="worker-profile-field">
        <label for="workerService">
          Service
        </label>

        <input
          id="workerService"
          name="service"
          type="text"
          maxlength="100"
          required
        >
      </div>

      <div class="worker-profile-field">
        <label for="workerLocation">
          Location
        </label>

        <input
          id="workerLocation"
          name="location"
          type="text"
          maxlength="200"
          required
        >
      </div>

      <div class="worker-profile-field">
        <label for="workerPhone">
          Phone
        </label>

        <input
          id="workerPhone"
          name="phone"
          type="tel"
          maxlength="30"
          autocomplete="tel"
          required
        >
      </div>

      <div class="worker-profile-field">
        <label for="workerExperience">
          Experience
        </label>

        <input
          id="workerExperience"
          name="experience"
          type="text"
          maxlength="100"
        >
      </div>

      <div class="worker-profile-field">
        <label for="workerSkills">
          Skills
        </label>

        <input
          id="workerSkills"
          name="skills"
          type="text"
          maxlength="1000"
          placeholder="e.g. Plumbing, Wiring, Painting"
          autocomplete="off"
        >

        <p class="worker-profile-help">
          Enter multiple skills separated by commas.
        </p>
      </div>

      <div class="worker-profile-field full-width">

        <div class="worker-profile-availability">

          <div class="worker-profile-availability-info">

            <p class="worker-profile-availability-title">
              Available for New Bookings
            </p>

            <p
              id="workerAvailabilityText"
              class="worker-profile-availability-text"
            >
              You can receive new booking requests when this is ON.
            </p>

          </div>

          <label
            class="worker-profile-switch"
            for="workerAvailability"
            aria-label="Worker availability"
          >

            <input
              id="workerAvailability"
              name="isAvailable"
              type="checkbox"
            >

            <span class="worker-profile-slider"></span>

          </label>

        </div>

      </div>

      <div class="worker-profile-field full-width">
        <label for="workerBio">
          Bio
        </label>

        <textarea
          id="workerBio"
          name="bio"
          maxlength="2000"
          placeholder="Tell customers about your experience and services."
        ></textarea>
      </div>

    </div>

    <div class="worker-profile-actions">

      <button
        id="saveWorkerProfileButton"
        type="submit"
      >
        Save Profile
      </button>

      <a href="worker-dashboard.html">
        Back to Dashboard
      </a>

    </div>

  </form>

</section>

<section
  id="workerDetailSection"
  class="worker-profile-card"
>

  <div
    id="workerDetail"
    class="worker-profile-loading"
  >
    Loading worker profile...
  </div>

</section>

  </main>  <script src="js/auth.js"></script>  <script src="js/app.js"></script>  <script>
    "use strict";

    (() => {
      const messageElement =
        document.getElementById(
          "workerProfileMessage"
        );

      const editSection =
        document.getElementById(
          "workerEditSection"
        );

      const detailElement =
        document.getElementById(
          "workerDetail"
        );

      const form =
        document.getElementById(
          "workerProfileForm"
        );

      const saveButton =
        document.getElementById(
          "saveWorkerProfileButton"
        );

      const nameInput =
        document.getElementById(
          "workerName"
        );

      const serviceInput =
        document.getElementById(
          "workerService"
        );

      const locationInput =
        document.getElementById(
          "workerLocation"
        );

      const phoneInput =
        document.getElementById(
          "workerPhone"
        );

      const experienceInput =
        document.getElementById(
          "workerExperience"
        );

      const skillsInput =
        document.getElementById(
          "workerSkills"
        );

      const bioInput =
        document.getElementById(
          "workerBio"
        );

      const availabilityInput =
        document.getElementById(
          "workerAvailability"
        );

      const availabilityText =
        document.getElementById(
          "workerAvailabilityText"
        );

      const params =
        new URLSearchParams(
          window.location.search
        );

      const editMode =
        params.get("edit") === "1" ||
        params.get("edit") === "true";

      const workerId =
        params.get("id");

      const jobId =
        params.get("jobId");

      let currentWorker = null;

      function escapeValue(value) {
        if (
          typeof window.escapeHtml ===
          "function"
        ) {
          return window.escapeHtml(
            value ?? ""
          );
        }

        const div =
          document.createElement("div");

        div.textContent =
          String(value ?? "");

        return div.innerHTML;
      }

      function showMessage(
        message,
        type = "error"
      ) {
        if (!messageElement) {
          return;
        }

        messageElement.textContent =
          message || "";

        messageElement.className =
          `worker-profile-message show ${type}`;
      }

      function clearMessage() {
        if (!messageElement) {
          return;
        }

        messageElement.textContent = "";

        messageElement.className =
          "worker-profile-message";
      }

      async function apiRequest(
        path,
        options = {}
      ) {
        if (
          typeof window.SWN ===
            "undefined" ||
          typeof window.SWN.request !==
            "function"
        ) {
          throw new Error(
            "API client is not available."
          );
        }

        return window.SWN.request(
          path,
          options
        );
      }

      function getResponseData(result) {
        if (
          result &&
          typeof result === "object" &&
          result.data &&
          typeof result.data ===
            "object"
        ) {
          return result.data;
        }

        return result || {};
      }

      function getWorkerFromResponse(
        result
      ) {
        const data =
          getResponseData(result);

        if (
          data &&
          data._id
        ) {
          return data;
        }

        return (
          data.worker ||
          data.profile ||
          data.data?.worker ||
          data.data?.profile ||
          data.data ||
          null
        );
      }

      function normalizeSkills(value) {
        if (
          Array.isArray(value)
        ) {
          return value
            .map((item) =>
              String(item ?? "")
                .trim()
                .slice(0, 100)
            )
            .filter(Boolean);
        }

        return String(value ?? "")
          .split(",")
          .map((item) =>
            item.trim().slice(0, 100)
          )
          .filter(Boolean);
      }

      function skillsToInput(
        skills
      ) {
        return normalizeSkills(
          skills
        ).join(", ");
      }

      function updateAvailabilityText(
        available
      ) {
        if (!availabilityText) {
          return;
        }

        availabilityText.textContent =
          available
            ? "You are available and can receive new booking requests."
            : "You are unavailable and will not receive new booking requests.";
      }

      function fillForm(worker) {
        if (!worker) {
          return;
        }

        if (nameInput) {
          nameInput.value =
            worker.name || "";
        }

        if (serviceInput) {
          serviceInput.value =
            worker.service || "";
        }

        if (locationInput) {
          locationInput.value =
            worker.location || "";
        }

        if (phoneInput) {
          phoneInput.value =
            worker.phone || "";
        }

        if (experienceInput) {
          experienceInput.value =
            worker.experience || "";
        }

        if (skillsInput) {
          skillsInput.value =
            skillsToInput(
              worker.skills
            );
        }

        if (bioInput) {
          bioInput.value =
            worker.bio || "";
        }

        if (availabilityInput) {
          availabilityInput.checked =
            worker.isAvailable !== false;

          updateAvailabilityText(
            availabilityInput.checked
          );
        }
      }

      function renderSkills(
        skills
      ) {
        const cleanSkills =
          normalizeSkills(skills);

        if (
          cleanSkills.length === 0
        ) {
          return "No skills added.";
        }

        return `
          <div class="worker-profile-skills">
            ${cleanSkills
              .map(
                (skill) => `
                  <span class="worker-profile-skill">
                    ${escapeValue(skill)}
                  </span>
                `
              )
              .join("")}
          </div>
        `;
      }

      function renderWorker(worker) {
        if (!detailElement) {
          return;
        }

        if (!worker) {
          detailElement.innerHTML = `
            <div class="worker-profile-empty">
              Worker profile not found.
            </div>
          `;

          return;
        }

        const verified =
          worker.verified === true;

        const available =
          worker.isAvailable !== false;

        detailElement.innerHTML = `
          <h2>
            ${escapeValue(
              worker.name || "Worker Profile"
            )}
          </h2>

          <div class="worker-profile-detail-row">
            <div class="worker-profile-detail-label">
              Verification
            </div>

            <div class="worker-profile-detail-value">
              <span class="worker-profile-badge ${verified ? "verified" : ""}">
                ${verified ? "Verified Worker" : "Not Verified"}
              </span>
            </div>
          </div>

          <div class="worker-profile-detail-row">
            <div class="worker-profile-detail-label">
              Availability
            </div>

            <div class="worker-profile-detail-value">
              <span class="worker-profile-badge ${available ? "available" : "unavailable"}">
                ${available ? "Available for New Bookings" : "Currently Unavailable"}
              </span>
            </div>
          </div>

          <div class="worker-profile-detail-row">
            <div class="worker-profile-detail-label">
              Service
            </div>

            <div class="worker-profile-detail-value">
              ${escapeValue(
                worker.service || "—"
              )}
            </div>
          </div>

          <div class="worker-profile-detail-row">
            <div class="worker-profile-detail-label">
              Location
            </div>

            <div class="worker-profile-detail-value">
              ${escapeValue(
                worker.location || "—"
              )}
            </div>
          </div>

          <div class="worker-profile-detail-row">
            <div class="worker-profile-detail-label">
              Phone
            </div>

            <div class="worker-profile-detail-value">
              ${escapeValue(
                worker.phone || "—"
              )}
            </div>
          </div>

          <div class="worker-profile-detail-row">
            <div class="worker-profile-detail-label">
              Experience
            </div>

            <div class="worker-profile-detail-value">
              ${escapeValue(
                worker.experience || "—"
              )}
            </div>
          </div>

          <div class="worker-profile-detail-row">
            <div class="worker-profile-detail-label">
              Skills
            </div>

            <div class="worker-profile-detail-value">
              ${renderSkills(
                worker.skills
              )}
            </div>
          </div>

          <div class="worker-profile-detail-row">
            <div class="worker-profile-detail-label">
              Bio
            </div>

            <div class="worker-profile-detail-value">
              ${escapeValue(
                worker.bio || "—"
              )}
            </div>
          </div>
        `;
      }

      async function loadOwnProfile() {
        const result =
          await apiRequest(
            "/workers/me/profile"
          );

        const worker =
          getWorkerFromResponse(
            result
          );

        if (!worker) {
          throw new Error(
            "Worker profile data was not returned."
          );
        }

        currentWorker = worker;

        fillForm(worker);
        renderWorker(worker);

        if (editSection) {
          editSection.hidden = false;
        }
      }

      async function loadPublicProfile() {
        if (!workerId) {
          throw new Error(
            "Worker ID is missing."
          );
        }

        const result =
          await apiRequest(
            `/workers/${encodeURIComponent(
              workerId
            )}`
          );

        const worker =
          getWorkerFromResponse(
            result
          );

        if (!worker) {
          throw new Error(
            "Worker profile data was not returned."
          );
        }

        currentWorker = worker;

        renderWorker(worker);
      }

      async function saveProfile(event) {
        event.preventDefault();

        clearMessage();

        if (!currentWorker?._id) {
          showMessage(
            "Worker profile ID is missing."
          );

          return;
        }

        const name =
          nameInput?.value.trim() || "";

        const service =
          serviceInput?.value.trim() || "";

        const location =
          locationInput?.value.trim() || "";

        const phone =
          phoneInput?.value.trim() || "";

        const experience =
          experienceInput?.value.trim() || "";

        const skills =
          normalizeSkills(
            skillsInput?.value || ""
          );

        const bio =
          bioInput?.value.trim() || "";

        const isAvailable =
          availabilityInput?.checked === true;

        if (
          name.length < 2
        ) {
          showMessage(
            "Name must be at least 2 characters."
          );

          nameInput?.focus();

          return;
        }

        if (
          service.length < 2
        ) {
          showMessage(
            "Service must be at least 2 characters."
          );

          serviceInput?.focus();

          return;
        }

        if (!location) {
          showMessage(
            "Location is required."
          );

          locationInput?.focus();

          return;
        }

        if (!phone) {
          showMessage(
            "Phone is required."
          );

          phoneInput?.focus();

          return;
        }

        const payload = {
          name,
          service,
          location,
          phone,
          experience,
          skills,
          bio,
          isAvailable
        };

        if (saveButton) {
          saveButton.disabled = true;
          saveButton.textContent =
            "Saving...";
        }

        try {
          const result =
            await apiRequest(
              `/workers/${encodeURIComponent(
                currentWorker._id
              )}`,
              {
                method: "PATCH",
                body: payload
              }
            );

          const updatedWorker =
            getWorkerFromResponse(
              result
            );

          currentWorker =
            updatedWorker ||
            {
              ...currentWorker,
              ...payload
            };

          fillForm(
            currentWorker
          );

          renderWorker(
            currentWorker
          );

          showMessage(
            "Worker profile updated successfully.",
            "success"
          );

        } catch (error) {
          console.error(
            "WORKER PROFILE UPDATE ERROR:",
            error
          );

          showMessage(
            error?.message ||
              "Unable to update worker profile."
          );

        } finally {
          if (saveButton) {
            saveButton.disabled = false;
            saveButton.textContent =
              "Save Profile";
          }
        }
      }

      function bindEvents() {
        if (form) {
          form.addEventListener(
            "submit",
            saveProfile
          );
        }

        if (
          availabilityInput
        ) {
          availabilityInput.addEventListener(
            "change",
            () => {
              updateAvailabilityText(
                availabilityInput.checked
              );
            }
          );
        }
      }

      async function initialize() {
        try {
          clearMessage();

          bindEvents();

          if (editMode) {
            await loadOwnProfile();
            return;
          }

          if (workerId) {
            await loadPublicProfile();
            return;
          }

          await loadOwnProfile();

        } catch (error) {
          console.error(
            "WORKER PROFILE LOAD ERROR:",
            error
          );

          if (detailElement) {
            detailElement.innerHTML = `
              <div class="worker-profile-error">
                ${escapeValue(
                  error?.message ||
                    "Unable to load worker profile."
                )}
              </div>
            `;
          }

          if (
            editMode &&
            editSection
          ) {
            editSection.hidden = true;
          }
        }
      }

      window.addEventListener(
        "DOMContentLoaded",
        initialize
      );
    })();
  </script></body></html>
