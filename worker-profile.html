<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Worker Profile | Smart Work Network</title>

  <meta
    name="description"
    content="Worker profile on Smart Work Network."
  >

  <link
    rel="stylesheet"
    href="css/main.css"
  >

  <style>
    .worker-profile-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .worker-profile-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    .worker-profile-grid {
      display: grid;
      grid-template-columns: repeat(
        2,
        minmax(0, 1fr)
      );
      gap: 18px;
    }

    .worker-profile-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .worker-profile-field.full-width {
      grid-column: 1 / -1;
    }

    .worker-profile-field label {
      font-weight: 600;
    }

    .worker-profile-field input,
    .worker-profile-field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #d7dce2;
      border-radius: 10px;
      font: inherit;
      background: #fff;
    }

    .worker-profile-field textarea {
      min-height: 130px;
      resize: vertical;
    }

    .worker-profile-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .worker-profile-actions button,
    .worker-profile-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 10px;
      border: 0;
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    .worker-profile-actions button {
      background: #111827;
      color: #fff;
    }

    .worker-profile-actions button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .worker-profile-actions a {
      background: #eef2f7;
      color: #111827;
    }

    .worker-profile-message {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .worker-profile-message.show {
      display: block;
    }

    .worker-profile-message.success {
      background: #eaf8ef;
      color: #176b35;
    }

    .worker-profile-message.error {
      background: #fff0f0;
      color: #a51d2d;
    }

    .worker-profile-loading,
    .worker-profile-empty {
      text-align: center;
      padding: 40px 20px;
    }

    .worker-profile-detail-row {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #edf0f3;
    }

    .worker-profile-detail-row:last-child {
      border-bottom: 0;
    }

    .worker-profile-detail-label {
      min-width: 140px;
      font-weight: 600;
    }

    .worker-profile-detail-value {
      flex: 1;
      word-break: break-word;
    }

    .worker-profile-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef2f7;
      font-size: 13px;
      font-weight: 600;
    }

    .worker-profile-badge.verified {
      background: #e8f7ed;
      color: #176b35;
    }

    .worker-profile-error {
      background: #fff0f0;
      color: #a51d2d;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    @media (max-width: 700px) {
      .worker-profile-grid {
        grid-template-columns: 1fr;
      }

      .worker-profile-field.full-width {
        grid-column: auto;
      }

      .worker-profile-detail-row {
        flex-direction: column;
        gap: 4px;
      }

      .worker-profile-detail-label {
        min-width: 0;
      }
    }
  </style>
</head>

<body>

  <main class="worker-profile-page">

    <div
      id="workerProfileMessage"
      class="worker-profile-message"
      role="alert"
      aria-live="polite"
    ></div>

    <section
      id="workerEditSection"
      class="worker-profile-card"
      hidden
    >

      <h1>Edit Worker Profile</h1>

      <p>
        Update your worker information below.
      </p>

      <form
        id="workerProfileForm"
        novalidate
      >

        <div class="worker-profile-grid">

          <div class="worker-profile-field">
            <label for="workerName">
              Name
            </label>

            <input
              id="workerName"
              name="name"
              type="text"
              maxlength="100"
              autocomplete="name"
              required
            >
          </div>

          <div class="worker-profile-field">
            <label for="workerService">
              Service
            </label>

            <input
              id="workerService"
              name="service"
              type="text"
              maxlength="100"
              required
            >
          </div>

          <div class="worker-profile-field">
            <label for="workerLocation">
              Location
            </label>

            <input
              id="workerLocation"
              name="location"
              type="text"
              maxlength="150"
              required
            >
          </div>

          <div class="worker-profile-field">
            <label for="workerPhone">
              Phone
            </label>

            <input
              id="workerPhone"
              name="phone"
              type="tel"
              maxlength="20"
              autocomplete="tel"
              required
            >
          </div>

          <div class="worker-profile-field">
            <label for="workerExperience">
              Experience
            </label>

            <input
              id="workerExperience"
              name="experience"
              type="text"
              maxlength="100"
            >
          </div>

          <div class="worker-profile-field full-width">
            <label for="workerBio">
              Bio
            </label>

            <textarea
              id="workerBio"
              name="bio"
              maxlength="1000"
            ></textarea>
          </div>

        </div>

        <div class="worker-profile-actions">

          <button
            id="saveWorkerProfileButton"
            type="submit"
          >
            Save Profile
          </button>

          <a href="worker-dashboard.html">
            Back to Dashboard
          </a>

        </div>

      </form>

    </section>

    <section
      id="workerDetailSection"
      class="worker-profile-card"
    >

      <div
        id="workerDetail"
        class="worker-profile-loading"
      >
        Loading worker profile...
      </div>

    </section>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    "use strict";

    (() => {
      const messageElement =
        document.getElementById(
          "workerProfileMessage"
        );

      const editSection =
        document.getElementById(
          "workerEditSection"
        );

      const detailSection =
        document.getElementById(
          "workerDetailSection"
        );

      const detailElement =
        document.getElementById(
          "workerDetail"
        );

      const form =
        document.getElementById(
          "workerProfileForm"
        );

      const saveButton =
        document.getElementById(
          "saveWorkerProfileButton"
        );

      const params =
        new URLSearchParams(
          window.location.search
        );

      const editMode =
        params.get("edit") === "1" ||
        params.get("edit") === "true";

      const workerId =
        params.get("id");

      const jobId =
        params.get("jobId");

      let currentWorker = null;

      function escapeValue(value) {
        if (
          typeof window.escapeHtml ===
          "function"
        ) {
          return window.escapeHtml(
            value ?? ""
          );
        }

        const div =
          document.createElement("div");

        div.textContent =
          String(value ?? "");

        return div.innerHTML;
      }

      function showMessage(
        message,
        type = "error"
      ) {
        if (!messageElement) {
          return;
        }

        messageElement.textContent =
          message || "";

        messageElement.className =
          `worker-profile-message show ${type}`;
      }

      function clearMessage() {
        if (!messageElement) {
          return;
        }

        messageElement.textContent = "";

        messageElement.className =
          "worker-profile-message";
      }

      async function apiRequest(
        path,
        options = {}
      ) {
        if (
          typeof window.SWN ===
            "undefined" ||
          typeof window.SWN.request !==
            "function"
        ) {
          throw new Error(
            "API client is not available."
          );
        }

        return window.SWN.request(
          path,
          options
        );
      }

      function getResponseData(result) {
        if (
          result &&
          typeof result === "object" &&
          result.data &&
          typeof result.data ===
            "object"
        ) {
          return result.data;
        }

        return result || {};
      }

      function getWorkerFromResponse(
        result
      ) {
        const data =
          getResponseData(result);

        return (
          data.worker ||
          data.profile ||
          data.data?.worker ||
          data.data?.profile ||
          data
        );
      }

      function getWorkerId(worker) {
        return String(
          worker?.id ||
          worker?._id ||
          worker?.workerId ||
          ""
        );
      }

      function populateForm(worker) {
        if (!worker) {
          return;
        }

        document.getElementById(
          "workerName"
        ).value =
          worker.name || "";

        document.getElementById(
          "workerService"
        ).value =
          worker.service || "";

        document.getElementById(
          "workerLocation"
        ).value =
          worker.location || "";

        document.getElementById(
          "workerPhone"
        ).value =
          worker.phone || "";

        document.getElementById(
          "workerExperience"
        ).value =
          worker.experience || "";

        document.getElementById(
          "workerBio"
        ).value =
          worker.bio || "";
      }

      function buildCheckoutUrl(id) {
        if (!id) {
          return "";
        }

        const checkoutParams =
          new URLSearchParams();

        checkoutParams.set(
          "workerId",
          id
        );

        if (jobId) {
          checkoutParams.set(
            "jobId",
            jobId
          );
        }

        return (
          `checkout.html?${checkoutParams.toString()}`
        );
      }

      function renderWorkerDetail(
        worker
      ) {
        if (!detailElement) {
          return;
        }

        if (!worker) {
          detailElement.innerHTML = `
            <div class="worker-profile-empty">
              <h2>
                Worker Profile Not Found
              </h2>

              <p>
                The requested worker profile
                could not be found.
              </p>
            </div>
          `;

          return;
        }

        const id =
          getWorkerId(worker);

        const verified =
          worker.verified === true ||
          worker.isVerified === true;

        const checkoutUrl =
          buildCheckoutUrl(id);

        detailElement.innerHTML = `
          <h1>
            ${escapeValue(
              worker.name ||
              "Worker Profile"
            )}
          </h1>

          ${
            verified
              ? `
                <p>
                  <span
                    class="worker-profile-badge verified"
                  >
                    Verified Worker
                  </span>
                </p>
              `
              : ""
          }

          <div
            class="worker-profile-detail-row"
          >
            <div
              class="worker-profile-detail-label"
            >
              Service
            </div>

            <div
              class="worker-profile-detail-value"
            >
              ${escapeValue(
                worker.service ||
                "Not specified"
              )}
            </div>
          </div>

          <div
            class="worker-profile-detail-row"
          >
            <div
              class="worker-profile-detail-label"
            >
              Location
            </div>

            <div
              class="worker-profile-detail-value"
            >
              ${escapeValue(
                worker.location ||
                "Not specified"
              )}
            </div>
          </div>

          <div
            class="worker-profile-detail-row"
          >
            <div
              class="worker-profile-detail-label"
            >
              Phone
            </div>

            <div
              class="worker-profile-detail-value"
            >
              ${escapeValue(
                worker.phone ||
                "Not specified"
              )}
            </div>
          </div>

          <div
            class="worker-profile-detail-row"
          >
            <div
              class="worker-profile-detail-label"
            >
              Experience
            </div>

            <div
              class="worker-profile-detail-value"
            >
              ${escapeValue(
                worker.experience ||
                "Not specified"
              )}
            </div>
          </div>

          <div
            class="worker-profile-detail-row"
          >
            <div
              class="worker-profile-detail-label"
            >
              About
            </div>

            <div
              class="worker-profile-detail-value"
            >
              ${escapeValue(
                worker.bio ||
                "No bio available."
              )}
            </div>
          </div>

          ${
            checkoutUrl
              ? `
                <div
                  class="worker-profile-actions"
                >
                  <a
                    href="${escapeValue(
                      checkoutUrl
                    )}"
                  >
                    Hire Worker
                  </a>
                </div>
              `
              : ""
          }
        `;
      }

      async function loadPublicProfile() {
        if (!workerId) {
          detailElement.innerHTML = `
            <div class="worker-profile-error">
              Worker ID is missing.
            </div>
          `;

          return;
        }

        try {
          const result =
            await apiRequest(
              `/workers/${encodeURIComponent(
                workerId
              )}`
            );

          const worker =
            getWorkerFromResponse(
              result
            );

          currentWorker =
            worker;

          renderWorkerDetail(
            worker
          );

        } catch (error) {
          detailElement.innerHTML = `
            <div class="worker-profile-error">
              ${escapeValue(
                error?.message ||
                "Unable to load worker profile."
              )}
            </div>
          `;
        }
      }

      async function loadEditProfile() {
        if (!editSection) {
          return;
        }

        const user =
          typeof window.protect ===
          "function"
            ? window.protect("worker")
            : null;

        if (!user) {
          return;
        }

        editSection.hidden = false;

        if (detailSection) {
          detailSection.hidden = true;
        }

        try {
          const result =
            await apiRequest(
              "/workers/me/profile"
            );

          const worker =
            getWorkerFromResponse(
              result
            );

          if (
            !worker ||
            !getWorkerId(worker)
          ) {
            throw new Error(
              "Worker profile was not found."
            );
          }

          currentWorker =
            worker;

          populateForm(worker);

        } catch (error) {
          showMessage(
            error?.message ||
            "Unable to load your worker profile."
          );
        }
      }

      async function saveProfile(
        event
      ) {
        event.preventDefault();

        clearMessage();

        if (
          !currentWorker ||
          !getWorkerId(currentWorker)
        ) {
          showMessage(
            "Worker profile is not loaded."
          );

          return;
        }

        const name =
          document.getElementById(
            "workerName"
          ).value.trim();

        const service =
          document.getElementById(
            "workerService"
          ).value.trim();

        const location =
          document.getElementById(
            "workerLocation"
          ).value.trim();

        const phone =
          document.getElementById(
            "workerPhone"
          ).value.trim();

        const experience =
          document.getElementById(
            "workerExperience"
          ).value.trim();

        const bio =
          document.getElementById(
            "workerBio"
          ).value.trim();

        if (
          !name ||
          !service ||
          !location ||
          !phone
        ) {
          showMessage(
            "Name, service, location and phone are required."
          );

          return;
        }

        if (saveButton) {
          saveButton.disabled = true;
          saveButton.textContent =
            "Saving...";
        }

        try {
          const id =
            getWorkerId(
              currentWorker
            );

          const result =
            await apiRequest(
              `/workers/${encodeURIComponent(
                id
              )}`,
              {
                method: "PATCH",
                body: JSON.stringify({
                  name,
                  service,
                  location,
                  phone,
                  experience,
                  bio
                })
              }
            );

          const worker =
            getWorkerFromResponse(
              result
            );

          if (worker) {
            currentWorker =
              worker;

            populateForm(worker);
          }

          showMessage(
            result?.message ||
            "Worker profile updated successfully.",
            "success"
          );

        } catch (error) {
          showMessage(
            error?.message ||
            "Unable to update worker profile."
          );

        } finally {
          if (saveButton) {
            saveButton.disabled = false;
            saveButton.textContent =
              "Save Profile";
          }
        }
      }

      if (form) {
        form.addEventListener(
          "submit",
          saveProfile
        );
      }

      document.addEventListener(
        "DOMContentLoaded",
        () => {
          if (editMode) {
            loadEditProfile();
          } else {
            loadPublicProfile();
          }
        }
      );
    })();
  </script>

</body>

</html>
