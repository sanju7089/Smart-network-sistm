<!doctype html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Work Details | Smart Work Network
  </title>

  <link
    rel="stylesheet"
    href="css/main.css"
  >

</head>


<body>


  <header class="header">

    <div class="container nav">

      <a
        class="brand"
        href="index.html"
      >
        Smart Work Network
      </a>


      <nav class="navlinks">

        <a href="services.html">
          Services
        </a>

        <a href="find-help.html">
          Find Help
        </a>

        <a href="workers.html">
          Workers
        </a>

        <span data-auth></span>

      </nav>

    </div>

  </header>


  <main>

    <section class="section">

      <div class="container">


        <!--
        ================================================
        EXISTING WORK DETAIL
        ================================================
        -->

        <div
          id="requestDetail"
        ></div>


        <!--
        ================================================
        OWNER / ADMIN MANAGEMENT
        ================================================
        -->

        <section
          id="workManagement"
          class="card"
          hidden
          style="margin-top: 24px;"
        >

          <div class="row between">

            <div>

              <h3>
                Manage Work
              </h3>

              <p class="muted">
                Edit or delete this work request.
              </p>

            </div>


            <div class="row">

              <button
                type="button"
                id="editWorkButton"
                class="btn btn-primary"
                hidden
              >
                Edit Work
              </button>


              <button
                type="button"
                id="deleteWorkButton"
                class="btn"
                hidden
              >
                Delete Work
              </button>

            </div>

          </div>

        </section>


        <!--
        ================================================
        EDITOR
        ================================================
        -->

        <div
          id="workEditor"
          hidden
          style="margin-top: 24px;"
        ></div>


      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <b>
        Smart Work Network
      </b>

      <p>
        Services • Workers • Work opportunities
      </p>


      <div class="row">

        <a href="support.html">
          Support
        </a>

        <a href="profile.html">
          Profile
        </a>

        <a href="urgent-help.html">
          Urgent Help
        </a>

      </div>

    </div>

  </footer>


  <!--
  IMPORTANT:
  app.js must load before work.js/work-manage.js
  -->

  <script src="js/app.js"></script>

  <script src="js/work.js"></script>

  <script src="js/work-manage.js"></script>


</body>

</html>
