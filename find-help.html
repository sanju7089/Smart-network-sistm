<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Post Work | Smart Work Network</title>

  <link
    rel="stylesheet"
    href="css/main.css"
  >
</head>

<body>

  <header class="header">
    <div class="container nav">

      <a
        class="brand"
        href="index.html"
      >
        Smart Work Network
      </a>

      <nav class="navlinks">
        <a href="services.html">Services</a>
        <a href="find-help.html">Find Help</a>
        <a href="workers.html">Workers</a>
        <span data-auth></span>
      </nav>

    </div>
  </header>

  <main>

    <section class="section">

      <div
        class="container"
        style="max-width: 720px"
      >

        <div class="card">

          <h1>Post Work Request</h1>

          <form
            class="form"
            id="workForm"
            onsubmit="event.preventDefault(); postWork()"
          >

            <label>
              Title
              <input name="title" required>
            </label>

            <label>
              Service

              <select name="service">
                <option>Electrician</option>
                <option>Plumber</option>
                <option>Carpenter</option>
                <option>Painter</option>
                <option>Cleaner</option>
                <option>AC Technician</option>
                <option>Other</option>
              </select>
            </label>

            <label>
              Location
              <input name="location" required>
            </label>

            <label>
              Budget ₹
              <input
                name="budget"
                type="number"
              >
            </label>

            <label>
              Description
              <textarea
                name="description"
                required
              ></textarea>
            </label>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Post Request
            </button>

          </form>

        </div>

      </div>

    </section>

  </main>

  <footer class="footer">

    <div class="container">

      <b>Smart Work Network</b>

      <p>
        Services • Workers • Work opportunities
      </p>

      <div class="row">
        <a href="support.html">Support</a>
        <a href="profile.html">Profile</a>
        <a href="urgent-help.html">Urgent Help</a>
      </div>

    </div>

  </footer>

  <script src="js/app.js"></script>
  <script src="js/work.js"></script>

</body>
          </html>
