<!doctype html>
<html lang="hi">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>काम पोस्ट करें | Smart Work Network</title>

  <link
    rel="stylesheet"
    href="css/main.css"
  >
</head>

<body>

  <header class="header">

    <div class="container nav">

      <a
        class="brand"
        href="index.html"
      >
        Smart Work Network
      </a>

      <nav class="navlinks">

        <a href="services.html">
          Services
        </a>

        <a href="find-help.html">
          Find Help
        </a>

        <a href="workers.html">
          Workers
        </a>

        <span data-auth></span>

      </nav>

    </div>

  </header>


  <main>

    <section class="section">

      <div class="container">

        <h1>नया काम पोस्ट करें</h1>

        <p class="lead">
          आपको जो काम करवाना है, उसकी जानकारी यहाँ भरें।
          पास के योग्य Worker इसे देखकर आपसे संपर्क कर सकता है।
        </p>


        <form
          id="workForm"
          class="card"
          onsubmit="postWork(event)"
        >

          <!-- काम का नाम -->

          <label for="title">
            काम का नाम
          </label>

          <input
            id="title"
            name="title"
            type="text"
            maxlength="200"
            placeholder="जैसे: घर में पंखा ठीक करवाना"
            required
          >


          <!-- काम का पूरा विवरण -->

          <label for="description">
            काम का पूरा विवरण
          </label>

          <textarea
            id="description"
            name="description"
            rows="6"
            maxlength="5000"
            placeholder="जैसे: कमरे का पंखा खराब है और उसे ठीक करवाना है।"
            required
          ></textarea>


          <!-- काम की श्रेणी -->

          <label for="category">
            काम किस प्रकार का है?
          </label>

          <input
            id="category"
            name="category"
            type="text"
            maxlength="100"
            placeholder="जैसे: घर का काम, इलेक्ट्रिकल, प्लंबिंग"
          >


          <!-- जरूरी सेवा -->

          <label for="service">
            किस तरह का Worker चाहिए?
          </label>

          <input
            id="service"
            name="service"
            type="text"
            maxlength="150"
            placeholder="जैसे: Electrician, Plumber, Carpenter"
          >


          <!-- स्थान -->

          <label for="location">
            काम कहाँ करना है?
          </label>

          <input
            id="location"
            name="location"
            type="text"
            maxlength="200"
            placeholder="जैसे: Gwalior, Madhya Pradesh"
          >


          <!-- कीमत -->

          <label for="budget">
            इस काम के लिए कितने रुपये देंगे? (₹)
          </label>

          <input
            id="budget"
            name="budget"
            type="number"
            min="0"
            step="0.01"
            inputmode="decimal"
            placeholder="जैसे: 500"
          >

          <small>
            यहाँ उस काम के लिए आपकी अनुमानित कीमत डालें।
            उदाहरण: ₹500
          </small>


          <br>


          <button
            class="btn btn-primary"
            type="submit"
          >
            काम पोस्ट करें
          </button>

        </form>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <b>Smart Work Network</b>

      <p>
        Services • Workers • Work opportunities
      </p>

    </div>

  </footer>


  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/work.js"></script>

</body>

</html>
