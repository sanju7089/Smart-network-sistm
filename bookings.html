  </footer>  <script src="js/app.js"></script>  <script src="js/auth.js"></script>  <script>

    /*
      ============================================================
      SMART WORK NETWORK
      COMPLETE BOOKINGS + RAZORPAY FRONTEND
      ============================================================

      Booking workflow:

      pending
        ├── accepted
        ├── rejected
        └── cancelled

      accepted
        ├── confirmed
        └── cancelled

      confirmed
        ├── in_progress
        └── cancelled

      in_progress
        └── completed

      completed
        └── terminal

      rejected
        └── terminal

      cancelled
        └── terminal


      Payment workflow:

      accepted / confirmed
        ↓
      Create Razorpay Order
        ↓
      Razorpay Checkout
        ↓
      Razorpay Payment
        ↓
      Backend Verification
        ↓
      Booking refresh
    */


    let currentUser = null;

    let userPayments = [];

    let paymentLoading = false;


    /*
      ============================================================
      HTML ESCAPE
      ============================================================
    */

    function escapeBookingHtml(value = "") {

      if (
        typeof window.escapeHtml === "function"
      ) {

        return window.escapeHtml(value);

      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      ============================================================
      DATE FORMAT
      ============================================================
    */

    function formatBookingDate(value) {

      if (!value) {
        return "Not scheduled";
      }

      const date = new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "Not scheduled";

      }

      return date.toLocaleString(
        "en-IN",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );

    }


    /*
      ============================================================
      CURRENCY
      ============================================================
    */

    function formatMoney(
      amount,
      currency = "INR"
    ) {

      const numericAmount =
        Number(amount);

      if (
        !Number.isFinite(
          numericAmount
        )
      ) {

        return "Amount unavailable";

      }

      try {

        return new Intl.NumberFormat(
          "en-IN",
          {
            style: "currency",
            currency: currency || "INR",
            maximumFractionDigits: 2
          }
        ).format(
          numericAmount
        );

      } catch {

        return `₹${numericAmount.toFixed(2)}`;

      }

    }


    /*
      ============================================================
      STATUS FORMAT
      ============================================================
    */

    function formatStatus(
      status = "pending"
    ) {

      return String(status)
        .replace(/_/g, " ")
        .replace(
          /\b\w/g,
          function(letter) {

            return letter.toUpperCase();

          }
        );

    }


    /*
      ============================================================
      MESSAGE
      ============================================================
    */

    function showBookingMessage(
      message,
      isError = false
    ) {

      const element =
        document.querySelector(
          "#bookingMessage"
        );

      if (!element) {
        return;
      }

      element.innerHTML = `

        <div class="notice">

          ${escapeBookingHtml(
            message || ""
          )}

        </div>

      `;

      if (isError) {

        console.error(
          message
        );

      }

    }


    /*
      ============================================================
      SAFE API JSON
      ============================================================
    */

    async function readApiResult(
      response
    ) {

      let result = {};

      try {

        result =
          await response.json();

      } catch {

        result = {};

      }

      return result;

    }


    /*
      ============================================================
      WORKER NAME
      ============================================================
    */

    function getWorkerName(
      booking
    ) {

      if (!booking.workerId) {

        return "Worker not available";

      }

      if (
        typeof booking.workerId ===
        "object"
      ) {

        return (
          booking.workerId.name ||
          booking.workerId.userId?.name ||
          "Worker"
        );

      }

      return "Worker";

    }


    /*
      ============================================================
      CUSTOMER NAME
      ============================================================
    */

    function getCustomerName(
      booking
    ) {

      if (!booking.customerId) {

        return "Customer not available";

      }

      if (
        typeof booking.customerId ===
        "object"
      ) {

        return (
          booking.customerId.name ||
          "Customer"
        );

      }

      return "Customer";

    }


    /*
      ============================================================
      JOB TITLE
      ============================================================
    */

    function getJobTitle(
      booking
    ) {

      if (!booking.jobId) {
        return "";
      }

      if (
        typeof booking.jobId ===
        "object"
      ) {

        return (
          booking.jobId.title ||
          booking.jobId.service ||
          booking.jobId.name ||
          ""
        );

      }

      return "";

    }


    /*
      ============================================================
      JOB BUDGET
      ============================================================
    */

    function getBookingAmount(
      booking
    ) {

      if (
        booking.jobId &&
        typeof booking.jobId ===
        "object"
      ) {

        const budget =
          Number(
            booking.jobId.budget
          );

        if (
          Number.isFinite(
            budget
          ) &&
          budget >= 0
        ) {

          return budget;

        }

      }

      if (
        Number.isFinite(
          Number(booking.amount)
        )
      ) {

        return Number(
          booking.amount
        );

      }

      return null;

    }


    /*
      ============================================================
      PAYMENT BOOKING ID
      ============================================================
    */

    function getPaymentBookingId(
      payment
    ) {

      if (!payment) {
        return "";
      }

      const booking =
        payment.bookingId;

      if (
        booking &&
        typeof booking === "object"
      ) {

        return String(
          booking._id ||
          booking.id ||
          ""
        );

      }

      return String(
        booking || ""
      );

    }


    /*
      ============================================================
      PAYMENT STATUS
      ============================================================
    */

    function isPaymentSuccessful(
      payment
    ) {

      if (!payment) {
        return false;
      }

      const status =
        String(
          payment.status || ""
        ).toLowerCase();

      return [
        "paid",
        "captured",
        "success",
        "successful"
      ].includes(
        status
      );

    }


    /*
      ============================================================
      FIND PAYMENT FOR BOOKING
      ============================================================
    */

    function getPaymentForBooking(
      bookingId
    ) {

      if (!bookingId) {
        return null;
      }

      return (
        userPayments.find(
          function(payment) {

            return (
              getPaymentBookingId(
                payment
              ) ===
              String(
                bookingId
              )
            );

          }
        ) ||
        null
      );

    }


    /*
      ============================================================
      LOAD USER PAYMENTS
      ============================================================
    */

    async function loadUserPayments() {

      if (
        !currentUser ||
        currentUser.role !==
          "customer"
      ) {

        userPayments = [];

        return;

      }


      try {

        const response =
          await apiFetch(
            "/payments"
          );


        const result =
          await readApiResult(
            response
          );


        if (
          !response.ok ||
          !result.success
        ) {

          userPayments = [];

          return;

        }


        userPayments =
          Array.isArray(
            result.data
          )
            ? result.data
            : [];


      } catch (error) {

        console.error(
          "LOAD PAYMENTS ERROR:",
          error
        );

        userPayments = [];

      }

    }


    /*
      ============================================================
      WORKER NEXT ACTIONS
      ============================================================
    */

    function getWorkerNextActions(
      status
    ) {

      const actions = {

        pending: [

          {
            value: "accepted",
            label: "Accept Booking"
          },

          {
            value: "rejected",
            label: "Reject Booking"
          }

        ],

        accepted: [

          {
            value: "confirmed",
            label: "Confirm Booking"
          }

        ],

        confirmed: [

          {
            value: "in_progress",
            label: "Start Work"
          }

        ],

        in_progress: [

          {
            value: "completed",
            label: "Complete Work"
          }

        ],

        completed: [],

        cancelled: [],

        rejected: []

      };


      return (
        actions[status] ||
        []
      );

    }


    /*
      ============================================================
      WORKER CANCELLATION RULE
      ============================================================

      Worker can cancel only:

      pending
      accepted
      confirmed

      Worker cannot cancel:

      rejected
      in_progress
      completed
      cancelled
    */

    function canWorkerCancelBooking(
      status
    ) {

      return [
        "pending",
        "accepted",
        "confirmed"
      ].includes(
        String(status || "")
          .toLowerCase()
      );

    }


    /*
      ============================================================
      WORKER ACTION BUTTONS
      ============================================================
    */

    function renderWorkerActions(
      bookingId,
      status
    ) {

      const actions =
        getWorkerNextActions(
          status
        );


      let html = "";


      if (actions.length) {

        html += actions
          .map(
            function(action) {

              const safeBookingId =
                escapeBookingHtml(
                  bookingId
                );

              const safeStatus =
                escapeBookingHtml(
                  action.value
                );


              return `

                <button
                  type="button"
                  class="btn btn-primary"
                  onclick="updateBookingStatus(
                    '${safeBookingId}',
                    '${safeStatus}'
                  )"
                >

                  ${escapeBookingHtml(
                    action.label
                  )}

                </button>

              `;

            }
          )
          .join("");

      }


      /*
        Worker cancellation is deliberately
        rendered separately from status update.

        This is important because the backend
        cancellation endpoint performs refund logic.
      */

      if (
        canWorkerCancelBooking(
          status
        )
      ) {

        const safeBookingId =
          escapeBookingHtml(
            bookingId
          );


        html += `

          <button
            type="button"
            class="btn"
            onclick="cancelBooking(
              '${safeBookingId}'
            )"
          >

            Cancel Booking

          </button>

        `;

      }


      if (!html) {

        return `

          <p class="muted">
            No further action is available.
          </p>

        `;

      }


      return html;

    }


    /*
      ============================================================
      PAYMENT SECTION
      ============================================================
    */

    function renderPaymentSection(
      booking,
      role,
      status
    ) {

      if (
        role !== "customer"
      ) {

        return "";

      }


      const bookingId =
        booking._id ||
        booking.id;


      if (!bookingId) {
        return "";
      }


      const payment =
        getPaymentForBooking(
          bookingId
        );


      const amount =
        getBookingAmount(
          booking
        );


      /*
        Payment already completed.
      */

      if (
        isPaymentSuccessful(
          payment
        )
      ) {

        return `

          <div class="notice">

            <b>
              Payment Status:
            </b>

            Paid

            ${
              payment?.transactionId
                ? `
                  <br>
                  <span class="muted">
                    Transaction:
                    ${escapeBookingHtml(
                      payment.transactionId
                    )}
                  </span>
                `
                : ""
            }

          </div>

        `;

      }


      /*
        Payment is allowed only after
        worker accepts or booking is confirmed.
      */

      if (
        ![
          "accepted",
          "confirmed"
        ].includes(
          status
        )
      ) {

        return "";

      }


      const amountText =
        amount !== null
          ? formatMoney(
              amount,
              payment?.currency ||
                "INR"
            )
          : "Amount will be loaded securely";


      return `

        <div class="card">

          <h4>
            Payment
          </h4>

          <p>
            <b>
              Amount:
            </b>

            ${escapeBookingHtml(
              amountText
            )}
          </p>

          <p class="muted">
            Secure payment powered by Razorpay.
          </p>

          <button
            type="button"
            class="btn btn-primary"
            onclick="startRazorpayPayment(
              '${escapeBookingHtml(
                bookingId
              )}'
            )"
          >
            Pay Now
          </button>

        </div>

      `;

    }


    /*
      ============================================================
      BOOKING CARD
      ============================================================
    */

    function renderBookingCard(
      booking,
      user
    ) {

      const bookingId =
        booking._id ||
        booking.id;


      if (!bookingId) {
        return "";
      }


      const status =
        String(
          booking.status ||
          "pending"
        ).toLowerCase();


      const role =
        user?.role ||
        "customer";


      const workerName =
        escapeBookingHtml(
          getWorkerName(
            booking
          )
        );


      const customerName =
        escapeBookingHtml(
          getCustomerName(
            booking
          )
        );


      const jobTitle =
        escapeBookingHtml(
          getJobTitle(
            booking
          )
        );


      const notes =
        escapeBookingHtml(
          booking.notes ||
          booking.customerMessage ||
          "No additional notes."
        );


      const amount =
        getBookingAmount(
          booking
        );


      let personSection =
        "";


      if (
        role === "worker"
      ) {

        personSection = `

          <p>

            <b>
              Customer:
            </b>

            ${customerName}

          </p>

        `;

      } else if (
        role === "admin"
      ) {

        personSection = `

          <p>

            <b>
              Customer:
            </b>

            ${customerName}

          </p>

          <p>

            <b>
              Worker:
            </b>

            ${workerName}

          </p>

        `;

      } else {

        personSection = `

          <p>

            <b>
              Worker:
            </b>

            ${workerName}

          </p>

        `;

      }


      let jobSection =
        "";


      if (jobTitle) {

        jobSection = `

          <p>

            <b>
              Work:
            </b>

            ${jobTitle}

          </p>

        `;

      }


      let amountSection =
        "";


      if (
        amount !== null
      ) {

        amountSection = `

          <p>

            <b>
              Booking Amount:
            </b>

            ${escapeBookingHtml(
              formatMoney(
                amount,
                "INR"
              )
            )}

          </p>

        `;

      }


      let actions =
        "";


      /*
        Customer cancellation.

        Customer can cancel:

        pending
        accepted
        confirmed

        Customer cannot cancel:

        rejected
        in_progress
        completed
        cancelled
      */

      if (
        role === "customer" &&
        [
          "pending",
          "accepted",
          "confirmed"
        ].includes(
          status
        )
      ) {

        actions += `

          <button
            type="button"
            class="btn"
            onclick="cancelBooking(
              '${escapeBookingHtml(
                bookingId
              )}'
            )"
          >

            Cancel Booking

          </button>

        `;

      }


      /*
        Worker workflow + cancellation.
      */

      if (
        role === "worker"
      ) {

        actions +=
          renderWorkerActions(
            bookingId,
            status
          );

      }


      /*
        Admin workflow.

        Admin status update remains available
        exactly as before. Cancellation itself
        should be performed through the backend
        cancellation endpoint when required.
      */

      if (
        role === "admin"
      ) {

        actions += `

          <select
            id="status-${escapeBookingHtml(
              bookingId
            )}"
          >

            <option value="pending">
              Pending
            </option>

            <option value="accepted">
              Accepted
            </option>

            <option value="rejected">
              Rejected
            </option>

            <option value="confirmed">
              Confirmed
            </option>

            <option value="in_progress">
              In Progress
            </option>

            <option value="completed">
              Completed
            </option>

            <option value="cancelled">
              Cancelled
            </option>

          </select>


          <button
            type="button"
            class="btn btn-primary"
            onclick="updateAdminBookingStatus(
              '${escapeBookingHtml(
                bookingId
              )}'
            )"
          >

            Update Status

          </button>

        `;

      }


      const paymentSection =
        renderPaymentSection(
          booking,
          role,
          status
        );


      return `

        <div class="card">

          <div class="row between">

            <h3>
              Booking
            </h3>

            <span class="tag">

              ${escapeBookingHtml(
                formatStatus(
                  status
                )
              )}

            </span>

          </div>


          ${personSection}


          ${jobSection}


          ${amountSection}


          <p>

            <b>
              Preferred Date:
            </b>

            ${escapeBookingHtml(
              formatBookingDate(
                booking.date
              )
            )}

          </p>


          <p>

            <b>
              Notes:
            </b>

            ${notes}

          </p>


          ${
            booking.workerMessage
              ? `
                <p>
                  <b>
                    Worker Message:
                  </b>
                  ${escapeBookingHtml(
                    booking.workerMessage
                  )}
                </p>
              `
              : ""
          }


          ${
            booking.rejectedAt
              ? `
                <p class="muted">
                  Rejected:
                  ${escapeBookingHtml(
                    formatBookingDate(
                      booking.rejectedAt
                    )
                  )}
                </p>
              `
              : ""
          }


          ${
            booking.acceptedAt
              ? `
                <p class="muted">
                  Accepted:
                  ${escapeBookingHtml(
                    formatBookingDate(
                      booking.acceptedAt
                    )
                  )}
                </p>
              `
              : ""
          }


          ${
            booking.confirmedAt
              ? `
                <p class="muted">
                  Confirmed:
                  ${escapeBookingHtml(
                    formatBookingDate(
                      booking.confirmedAt
                    )
                  )}
                </p>
              `
              : ""
          }


          ${
            booking.startedAt
              ? `
                <p class="muted">
                  Work Started:
                  ${escapeBookingHtml(
                    formatBookingDate(
                      booking.startedAt
                    )
                  )}
                </p>
              `
              : ""
          }


          ${
            booking.completedAt
              ? `
                <p class="muted">
                  Completed:
                  ${escapeBookingHtml(
                    formatBookingDate(
                      booking.completedAt
                    )
                  )}
                </p>
              `
              : ""
          }


          ${
            booking.cancelledAt
              ? `
                <p class="muted">
                  Cancelled:
                  ${escapeBookingHtml(
                    formatBookingDate(
                      booking.cancelledAt
                    )
                  )}
                </p>
              `
              : ""
          }


          <p class="muted">

            Created:

            ${escapeBookingHtml(
              formatBookingDate(
                booking.createdAt
              )
            )}

          </p>


          ${
            paymentSection
              ? `
                <div
                  style="
                    margin-top:16px;
                  "
                >
                  ${paymentSection}
                </div>
              `
              : ""
          }


          ${
            actions
              ? `
                <div
                  class="row"
                  style="
                    margin-top:16px;
                  "
                >

                  ${actions}

                </div>
              `
              : ""
          }

        </div>

      `;

    }


    /*
      ============================================================
      LOAD BOOKINGS
      ============================================================
    */

    async function loadBookings() {

      const user =
        typeof window.protect ===
        "function"
          ? window.protect()
          : null;


      if (!user) {
        return;
      }


      currentUser =
        user;


      const list =
        document.querySelector(
          "#bookingsList"
        );


      const subtitle =
        document.querySelector(
          "#bookingSubtitle"
        );


      if (!list) {
        return;
      }


      list.innerHTML = `

        <div class="notice">
          Loading bookings...
        </div>

      `;


      try {

        /*
          Load payments first for
          customer payment state.
        */

        await loadUserPayments();


        const response =
          await apiFetch(
            "/bookings"
          );


        const result =
          await readApiResult(
            response
          );


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Unable to load bookings."
          );

        }


        const bookings =
          Array.isArray(
            result.data
          )
            ? result.data
            : [];


        if (subtitle) {

          subtitle.textContent =
            `${bookings.length} booking(s) found`;

        }


        if (
          !bookings.length
        ) {

          list.innerHTML = `

            <div class="notice">

              No bookings found yet.

            </div>

          `;

          return;

        }


        list.innerHTML =
          bookings
            .map(
              function(booking) {

                return renderBookingCard(
                  booking,
                  user
                );

              }
            )
            .join("");


      } catch (error) {

        console.error(
          "LOAD BOOKINGS ERROR:",
          error
        );


        if (subtitle) {

          subtitle.textContent =
            "Unable to load bookings";

        }


        list.innerHTML = `

          <div class="notice">

            ${escapeBookingHtml(
              error.message ||
              "Unable to load bookings."
            )}

          </div>

        `;

      }

    }


    /*
      ============================================================
      CANCEL BOOKING
      ============================================================

      IMPORTANT:

      Cancellation does NOT use:

      PATCH /bookings/:id/status

      It uses:

      PATCH /bookings/:id/cancel

      This ensures the backend cancellation
      and Razorpay refund logic remains
      authoritative.
    */

    async function cancelBooking(
      bookingId
    ) {

      if (!bookingId) {

        showBookingMessage(
          "Invalid booking ID.",
          true
        );

        return;

      }


      const confirmed =
        window.confirm(
          "Are you sure you want to cancel this booking? If a payment has already been completed, the server will process the applicable refund."
        );


      if (!confirmed) {
        return;
      }


      try {

        showBookingMessage(
          "Cancelling booking securely..."
        );


        const response =
          await apiFetch(
            `/bookings/${encodeURIComponent(
              bookingId
            )}/cancel`,
            {
              method: "PATCH"
            }
          );


        const result =
          await readApiResult(
            response
          );


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Unable to cancel booking."
          );

        }


        /*
          Backend remains the source of truth.

          The backend may return refund
          information such as:

          refunded
          refundId
          refundAmount
        */

        const refund =
          result.refund ||
          result.data?.refund ||
          null;


        let successMessage =
          result.message ||
          "Booking cancelled successfully.";


        if (
          refund &&
          (
            refund.refunded === true ||
            refund.status === "refunded"
          )
        ) {

          const refundAmount =
            Number(
              refund.refundAmount ??
              refund.amount
            );


          if (
            Number.isFinite(
              refundAmount
            ) &&
            refundAmount > 0
          ) {

            successMessage +=
              ` Refund processed: ${formatMoney(
                refundAmount / 100,
                "INR"
              )}.`;

          } else {

            successMessage +=
              " Payment refund has been processed.";

          }

        } else if (
          refund &&
          refund.alreadyRefunded === true
        ) {

          successMessage +=
            " The payment was already refunded.";

        } else if (
          refund &&
          refund.refundId
        ) {

          successMessage +=
            ` Refund ID: ${String(
              refund.refundId
            )}.`;

        }


        showBookingMessage(
          successMessage
        );


        await loadBookings();


      } catch (error) {

        console.error(
          "CANCEL BOOKING ERROR:",
          error
        );


        /*
          If refund fails, backend should
          keep the booking unchanged.

          Therefore we do NOT locally mark
          the booking as cancelled.
        */

        showBookingMessage(
          error.message ||
          "Unable to cancel booking. The booking was not cancelled.",
          true
        );

      }

    }


    /*
      ============================================================
      WORKER STATUS UPDATE
      ============================================================
    */

    async function updateBookingStatus(
      bookingId,
      status
    ) {

      if (!bookingId) {

        showBookingMessage(
          "Invalid booking ID.",
          true
        );

        return;

      }


      if (!status) {

        showBookingMessage(
          "Invalid booking status.",
          true
        );

        return;

      }


      /*
        Cancellation must always use
        the dedicated cancellation endpoint.

        This prevents accidental bypass
        of refund handling.
      */

      if (
        String(status).toLowerCase() ===
        "cancelled"
      ) {

        await cancelBooking(
          bookingId
        );

        return;

      }


      try {

        showBookingMessage(
          "Updating booking status..."
        );


        const response =
          await apiFetch(
            `/bookings/${encodeURIComponent(
              bookingId
            )}/status`,
            {
              method: "PATCH",

              body:
                JSON.stringify({
                  status
                })
            }
          );


        const result =
          await readApiResult(
            response
          );


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Unable to update booking status."
          );

        }


        showBookingMessage(
          result.message ||
          "Booking status updated successfully."
        );


        await loadBookings();


      } catch (error) {

        console.error(
          "UPDATE BOOKING STATUS ERROR:",
          error
        );


        showBookingMessage(
          error.message ||
          "Unable to update booking status.",
          true
        );

      }

    }


    /*
      ============================================================
      ADMIN STATUS UPDATE
      ============================================================
    */

    async function updateAdminBookingStatus(
      bookingId
    ) {

      if (!bookingId) {

        showBookingMessage(
          "Invalid booking ID.",
          true
        );

        return;

      }


      const select =
        document.querySelector(
          `#status-${CSS.escape(
            bookingId
          )}`
        );


      if (!select) {

        showBookingMessage(
          "Booking status selector not found.",
          true
        );

        return;

      }


      const status =
        select.value;


      if (!status) {

        showBookingMessage(
          "Please select a booking status.",
          true
        );

        return;

      }


      /*
        Never send cancelled through the
        generic status endpoint.

        Dedicated cancellation endpoint
        is required for refund handling.
      */

      if (
        String(status).toLowerCase() ===
        "cancelled"
      ) {

        await cancelBooking(
          bookingId
        );

        return;

      }


      try {

        showBookingMessage(
          "Updating booking status..."
        );


        const response =
          await apiFetch(
            `/bookings/${encodeURIComponent(
              bookingId
            )}/status`,
            {
              method: "PATCH",

              body:
                JSON.stringify({
                  status
                })
            }
          );


        const result =
          await readApiResult(
            response
          );


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Unable to update booking status."
          );

        }


        showBookingMessage(
          result.message ||
          "Booking status updated successfully."
        );


        await loadBookings();


      } catch (error) {

        console.error(
          "ADMIN BOOKING STATUS ERROR:",
          error
        );


        showBookingMessage(
          error.message ||
          "Unable to update booking status.",
          true
        );

      }

    }


    /*
      ============================================================
      RAZORPAY PAYMENT
      ============================================================
    */

    async function startRazorpayPayment(
      bookingId
    ) {

      if (!bookingId) {

        showBookingMessage(
          "Invalid booking ID.",
          true
        );

        return;

      }


      if (paymentLoading) {

        showBookingMessage(
          "A payment is already being prepared."
        );

        return;

      }


      paymentLoading =
        true;


      try {

        /*
          --------------------------------------------------------
          STEP 1
          Load Razorpay public configuration
          --------------------------------------------------------
        */

        showBookingMessage(
          "Preparing secure payment..."
        );


        const configResponse =
          await apiFetch(
            "/payments/razorpay/config"
          );


        const configResult =
          await readApiResult(
            configResponse
          );


        if (
          !configResponse.ok ||
          !configResult.success
        ) {

          throw new Error(
            configResult.message ||
            "Unable to load Razorpay configuration."
          );

        }


        const keyId =
          configResult.data?.keyId;


        const currency =
          configResult.data?.currency ||
          "INR";


        if (!keyId) {

          throw new Error(
            "Razorpay public key is unavailable."
          );

        }


        /*
          --------------------------------------------------------
          STEP 2
          Make sure Razorpay Checkout loaded
          --------------------------------------------------------
        */

        if (
          typeof window.Razorpay !==
          "function"
        ) {

          throw new Error(
            "Razorpay Checkout failed to load."
          );

        }


        /*
          --------------------------------------------------------
          STEP 3
          Create secure order on backend
          --------------------------------------------------------
        */

        showBookingMessage(
          "Creating secure payment order..."
        );


        const orderResponse =
          await apiFetch(
            "/payments/razorpay/order",
            {
              method: "POST",

              body:
                JSON.stringify({
                  bookingId
                })
            }
          );


        const orderResult =
          await readApiResult(
            orderResponse
          );


        if (
          !orderResponse.ok ||
          !orderResult.success
        ) {

          throw new Error(
            orderResult.message ||
            "Unable to create payment order."
          );

        }


        const order =
          orderResult.data?.order;


        if (!order?.id) {

          throw new Error(
            "Invalid Razorpay order returned by server."
          );

        }


        const orderAmount =
          Number(
            order.amount
          );


        if (
          !Number.isFinite(
            orderAmount
          ) ||
          orderAmount <= 0
        ) {

          throw new Error(
            "Invalid payment amount returned by server."
          );

        }


        /*
          --------------------------------------------------------
          STEP 4
          Open Razorpay
          --------------------------------------------------------
        */

        const options = {

          key: keyId,

          amount:
            orderAmount,

          currency:
            order.currency ||
            currency,

          name:
            "Smart Work Network",

          description:
            "Smart Work Network booking payment",

          order_id:
            order.id,


          /*
            ------------------------------------------------------
            STEP 5
            Razorpay success callback
            ------------------------------------------------------
          */

          handler:
            async function(
              paymentResponse
            ) {

              try {

                showBookingMessage(
                  "Payment received. Verifying payment securely..."
                );


                if (
                  !paymentResponse?.razorpay_order_id ||
                  !paymentResponse?.razorpay_payment_id ||
                  !paymentResponse?.razorpay_signature
                ) {

                  throw new Error(
                    "Incomplete Razorpay payment response."
                  );

                }


                /*
                  ------------------------------------------------
                  STEP 6
                  Verify signature on backend
                  ------------------------------------------------
                */

                const verifyResponse =
                  await apiFetch(
                    "/payments/razorpay/verify",
                    {
                      method: "POST",

                      body:
                        JSON.stringify({

                          razorpay_order_id:
                            paymentResponse
                              .razorpay_order_id,

                          razorpay_payment_id:
                            paymentResponse
                              .razorpay_payment_id,

                          razorpay_signature:
                            paymentResponse
                              .razorpay_signature

                        })
                    }
                  );


                const verifyResult =
                  await readApiResult(
                    verifyResponse
                  );


                if (
                  !verifyResponse.ok ||
                  !verifyResult.success
                ) {

                  throw new Error(
                    verifyResult.message ||
                    "Payment verification failed."
                  );

                }


                showBookingMessage(
                  verifyResult.message ||
                  "Payment successful and verified."
                );


                /*
                  Reload payment + booking data.
                */

                await loadBookings();


              } catch (error) {

                console.error(
                  "RAZORPAY VERIFY ERROR:",
                  error
                );


                showBookingMessage(
                  error.message ||
                  "Payment verification failed.",
                  true
                );

              }

            },


          /*
            ------------------------------------------------------
            PAYMENT MODAL CLOSED
            ------------------------------------------------------
          */

          modal: {

            ondismiss:
              function() {

                showBookingMessage(
                  "Payment window closed."
                );

              }

          },


          /*
            ------------------------------------------------------
            PAYMENT THEME
            ------------------------------------------------------
          */

          theme: {

            color:
              "#111827"

          }

        };


        /*
          --------------------------------------------------------
          STEP 7
          Create Razorpay instance
          --------------------------------------------------------
        */

        const razorpay =
          new window.Razorpay(
            options
          );


        /*
          --------------------------------------------------------
          PAYMENT FAILED
          --------------------------------------------------------
        */

        razorpay.on(
          "payment.failed",
          function(
            response
          ) {

            console.error(
              "RAZORPAY PAYMENT FAILED:",
              response
            );


            showBookingMessage(
              response?.error?.description ||
              "Payment failed. Please try again.",
              true
            );

          }
        );


        /*
          --------------------------------------------------------
          STEP 8
          Open checkout
          --------------------------------------------------------
        */

        razorpay.open();


      } catch (error) {

        console.error(
          "RAZORPAY PAYMENT ERROR:",
          error
        );


        showBookingMessage(
          error.message ||
          "Unable to start payment.",
          true
        );

      } finally {

        paymentLoading =
          false;

      }

    }


    /*
      ============================================================
      GLOBAL FUNCTIONS
      ============================================================
    */

    window.startRazorpayPayment =
      startRazorpayPayment;

    window.cancelBooking =
      cancelBooking;

    window.updateBookingStatus =
      updateBookingStatus;

    window.updateAdminBookingStatus =
      updateAdminBookingStatus;


    /*
      ============================================================
      REFRESH BUTTON
      ============================================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        const refreshButton =
          document.querySelector(
            "#refreshBookingsButton"
          );


        if (refreshButton) {

          refreshButton.addEventListener(
            "click",
            function() {

              loadBookings();

            }
          );

        }


        /*
          Initial booking load.
        */

        loadBookings();

      }
    );

  </script>
