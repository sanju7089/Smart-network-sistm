<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Smart Work Network Worker Dashboard"
  >

  <title>

  </title>

  <link
    rel="stylesheet"
    href="css/main.css"

  <style>

    .worker-dashboard-extra {
      margin-top: 24px;
    }

    .worker-dashboard-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );
      gap: 16px;
      margin-top: 16px;
    }

    .worker-info-card {
      padding: 18px;
      border-radius: 12px;
      border: 1px solid
        rgba(0, 0, 0, .08);
      background: #fff;
    }

    .worker-info-card h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .worker-info-value {
      font-size: 24px;
      font-weight: 700;
      margin-top: 8px;
    }

    .worker-dashboard-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .worker-dashboard-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f1f3f5;
      font-size: 13px;
    }

    .worker-dashboard-tag.available {
      background: #e8f7ed;
      color: #176b35;
    }

    .worker-dashboard-tag.unavailable {
      background: #fff0f0;
      color: #a51d2d;
    }

    .worker-dashboard-tag.verified {
      background: #e8f7ed;
      color: #176b35;
    }

    .worker-dashboard-loading {
      padding: 16px;
      border-radius: 10px;
      background: #f7f7f7;
    }

    .worker-dashboard-error {
      padding: 16px;
      border-radius: 10px;
      background: #fff0f0;
      color: #8b1e2d;
    }

    .worker-dashboard-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .worker-dashboard-section {
      margin-top: 24px;
    }

    .worker-dashboard-section h2 {
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {

      .worker-info-card {
        padding: 15px;
      }

      .worker-dashboard-actions {
        flex-direction: column;
      }

      .worker-dashboard-actions a {
        width: 100%;
        text-align: center;
      }

    }

  </style>

</head>

  <!-- AUTH -->

  <!-- CENTRAL API -->

  <script src="js/app.js"></script>

  <!-- MAIN DASHBOARD -->

  <script src="js/dashboard.js"></script>


  <script>

    "use strict";


    function workerDashboardEscape(
      value = ""
    ) {

      if (
        typeof window.escapeHtml ===
        "function"
      ) {
        return window.escapeHtml(
          value
        );
      }

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    async function workerDashboardRequest(
      endpoint
    ) {

      if (
        window.SWN &&
        typeof window.SWN.request ===
          "function"
      ) {

        return window.SWN.request(
          endpoint
        );

      }

      if (
        typeof window.apiFetch ===
        "function"
      ) {

        return window.apiFetch(
          endpoint
        );

      }

      throw new Error(
        "Central API client is not available."
      );

    }


    function workerDashboardData(
      result
    ) {

      if (
        !result ||
        typeof result !==
          "object"
      ) {
        return {};
      }

      if (
        result.data !==
          undefined &&
        result.data !== null
      ) {
        return result.data;
      }

      return result;

    }


    function workerDashboardMoney(
      value
    ) {

      const amount =
        Number(value);

      if (
        !Number.isFinite(amount)
      ) {
        return "₹0";
      }

      return `₹${new Intl.NumberFormat(
        "en-IN",
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }
      ).format(amount)}`;

    }


    function workerDashboardMoneyPaise(
      value
    ) {

      const amount =
        Number(value);

      if (
        !Number.isFinite(amount)
      ) {
        return "₹0";
      }

      return workerDashboardMoney(
        amount / 100
      );

    }


    function workerDashboardSkills(
      skills
    ) {

      if (
        !Array.isArray(skills) ||
        !skills.length
      ) {

        return `
          <span class="worker-dashboard-tag">
            No skills added
          </span>
        `;

      }

      const seen =
        new Set();

      return skills
        .map(
          skill =>
            String(
              skill ?? ""
            ).trim()
        )
        .filter(Boolean)
        .filter(
          skill => {

            const key =
              skill.toLowerCase();

            if (
              seen.has(key)
            ) {
              return false;
            }

            seen.add(key);

            return true;

          }
        )
        .slice(0, 50)
        .map(
          skill => `
            <span
              class="worker-dashboard-tag"
            >
              ${workerDashboardEscape(
                skill
              )}
            </span>
          `
        )
        .join("");

    }


    async function loadWorkerDashboardExtra() {

      const extra =
        document.getElementById(
          "workerDashboardExtra"
        );

      const cards =
        document.getElementById(
          "workerDashboardCards"
        );

      const skills =
        document.getElementById(
          "workerDashboardSkills"
        );

      if (
        !extra ||
        !cards ||
        !skills
      ) {
        return;
      }


      let user = null;


      if (
        window.SWN &&
        typeof window.SWN.user ===
          "function"
      ) {

        user =
          window.SWN.user();

      }


      if (
        !user &&
        typeof window.getCurrentUser ===
          "function"
      ) {

        user =
          window.getCurrentUser();

      }


      if (!user) {

        try {

          const authResult =
            await workerDashboardRequest(
              "/auth/me"
            );

          const authData =
            workerDashboardData(
              authResult
            );

          user =
            authData?.user ||
            authData?.data?.user ||
            authData;

        } catch (error) {

          console.error(
            "WORKER AUTH ERROR:",
            error
          );

          return;

        }

      }


      const role =
        String(
          user?.role ||
          user?.userType ||
          user?.accountType ||
          ""
        )
          .trim()
          .toLowerCase();


      if (
        role !== "worker"
      ) {

        return;

      }


      extra.hidden =
        false;


      cards.innerHTML = `
        <div
          class="worker-dashboard-loading"
        >
          Loading worker information...
        </div>
      `;


      skills.innerHTML = `
        <span
          class="worker-dashboard-tag"
        >
          Loading skills...
        </span>
      `;


      const [
        profileResult,
        earningsResult
      ] = await Promise.all([

        workerDashboardRequest(
          "/workers/me/profile"
        ),

        workerDashboardRequest(
          "/earnings/me"
        )

      ]);


      const profileData =
        workerDashboardData(
          profileResult
        );

      const earningsData =
        workerDashboardData(
          earningsResult
        );


      const worker =
        profileData?.worker ||
        profileData?.profile ||
        profileData;


      const earnings =
        earningsData?.earnings ||
        earningsData;


      if (
        !worker ||
        typeof worker !==
          "object"
      ) {

        cards.innerHTML = `
          <div
            class="worker-dashboard-error"
          >
            Worker profile could not
            be loaded.
          </div>
        `;

        return;

      }


      const isAvailable =
        worker.isAvailable === true;


      const isVerified =
        worker.verified === true;


      const profileCompleted =
        worker.profileCompleted === true;


      const gross =
        earnings?.gross ??
        earnings?.totalGross ??
        earnings?.total ??
        0;


      const completedEarnings =
        earnings?.completed ??
        earnings?.completedAmount ??
        earnings?.completedEarnings ??
        0;


      const pendingWork =
        earnings?.pendingWork ??
        earnings?.pending ??
        0;


      const bookingCount =
        earnings?.count ??
        earnings?.bookingCount ??
        0;


      cards.innerHTML = `

        <div class="worker-info-card">

          <h3>
            Availability
          </h3>

          <div
            class="
              worker-dashboard-tag
              ${
                isAvailable
                  ? "available"
                  : "unavailable"
              }
            "
          >
            ${
              isAvailable
                ? "Available for New Bookings"
                : "Currently Unavailable"
            }
          </div>

        </div>


        <div class="worker-info-card">

          <h3>
            Verification
          </h3>

          <div
            class="
              worker-dashboard-tag
              ${
                isVerified
                  ? "verified"
                  : ""
              }
            "
          >
            ${
              isVerified
                ? "Verified Worker"
                : "Verification Pending"
            }
          </div>

        </div>


        <div class="worker-info-card">

          <h3>
            Profile
          </h3>

          <div class="worker-info-value">

            ${
              profileCompleted
                ? "Complete"
                : "Incomplete"
            }

          </div>

        </div>


        <div class="worker-info-card">

          <h3>
            Gross Earnings
          </h3>

          <div class="worker-info-value">

            ${workerDashboardMoney(
              gross
            )}

          </div>

        </div>


        <div class="worker-info-card">

          <h3>
            Completed Earnings
          </h3>

          <div class="worker-info-value">

            ${workerDashboardMoney(
              completedEarnings
            )}

          </div>

        </div>


        <div class="worker-info-card">

          <h3>
            Pending Work
          </h3>

          <div class="worker-info-value">

            ${workerDashboardMoney(
              pendingWork
            )}

          </div>

        </div>


        <div class="worker-info-card">

          <h3>
            Earnings Records
          </h3>

          <div class="worker-info-value">

            ${workerDashboardEscape(
              bookingCount
            )}

          </div>

        </div>

      `;


      skills.innerHTML =
        workerDashboardSkills(
          worker.skills
        );

    }


    /*
     * dashboard.js and this section
     * initialize independently.
     * A short observer ensures the worker
     * information is loaded after the
     * dashboard has identified the user.
     */

    function startWorkerDashboardExtra() {

      loadWorkerDashboardExtra();

      const target =
        document.getElementById(
          "dashboardContent"
        );

      if (!target) {
        return;
      }

      let attempts = 0;

      const timer =
        setInterval(
          async () => {

            attempts++;

            const currentUser =
              window.SWN &&
              typeof window.SWN.user ===
                "function"
                ? window.SWN.user()
                : null;

            const role =
              String(
                currentUser?.role ||
                ""
              )
                .trim()
                .toLowerCase();

            if (
              role === "worker"
            ) {

              clearInterval(
                timer
              );

              await loadWorkerDashboardExtra();

              return;

            }

            if (
              attempts >= 20
            ) {

              clearInterval(
                timer
              );

            }

          },
          300
        );

    }


    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        startWorkerDashboardExtra
      );

    } else {

      startWorkerDashboardExtra();

    }

  </script>


</body>
