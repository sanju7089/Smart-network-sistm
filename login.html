<!doctype html>
<html>

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Login | Smart Work Network</title>

  <link
    rel="stylesheet"
    href="css/main.css"
  >
</head>

<body>

  <header class="header">

    <div class="container nav">

      <a
        class="brand"
        href="index.html"
      >
        Smart Work Network
      </a>

      <nav class="navlinks">

        <a href="services.html">
          Services
        </a>

        <a href="find-help.html">
          Find Help
        </a>

        <a href="workers.html">
          Workers
        </a>

        <span data-auth></span>

      </nav>

    </div>

  </header>


  <main>

    <section class="section">

      <div
        class="container"
        style="max-width: 560px"
      >

        <div class="card">

          <h1>Login</h1>

          <form
            class="form"
            id="loginForm"
            onsubmit="event.preventDefault(); login()"
          >

            <label>
              Email

              <input
                name="email"
                type="email"
                required
              >
            </label>


            <label>
              Password

              <input
                name="password"
                type="password"
                required
              >
            </label>


            <button
              type="submit"
              class="btn btn-primary"
            >
              Login
            </button>

          </form>


          <p>
            New user?
            <a href="signup.html">
              Create account
            </a>
          </p>


          <div class="notice">
            Demo admin: admin@smartwork.local / admin123
          </div>

        </div>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <b>Smart Work Network</b>

      <p>
        Services • Workers • Work opportunities
      </p>

      <div class="row">

        <a href="support.html">Support</a>

        <a href="profile.html">Profile</a>

        <a href="urgent-help.html">Urgent Help</a>

      </div>

    </div>

  </footer>


  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
