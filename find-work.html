  </header>  <main><section class="section">

  <div class="container">

    <h1>Find Work</h1>

    <p class="lead">
      Search and browse available work requests.
    </p>


    <!--
    ========================================
    SEARCH + FILTERS
    ========================================
    -->

    <div
      class="card"
      style="
        margin-bottom:20px;
      "
    >

      <form
        id="workSearchForm"
        class="form"
        autocomplete="off"
      >

        <div>

          <label
            for="workSearch"
          >
            Search Work
          </label>

          <input
            id="workSearch"
            name="search"
            type="search"
            maxlength="200"
            placeholder="Search by title, service, location..."
            autocomplete="off"
          >

        </div>


        <div
          style="
            display:grid;
            grid-template-columns:
              repeat(
                auto-fit,
                minmax(180px,1fr)
              );
            gap:14px;
          "
        >

          <div>

            <label
              for="workCategory"
            >
              Category
            </label>

            <input
              id="workCategory"
              name="category"
              type="text"
              maxlength="100"
              placeholder="e.g. Plumbing"
            >

          </div>


          <div>

            <label
              for="workService"
            >
              Service
            </label>

            <input
              id="workService"
              name="service"
              type="text"
              maxlength="150"
              placeholder="e.g. Home Repair"
            >

          </div>


          <div>

            <label
              for="workLocation"
            >
              Location
            </label>

            <input
              id="workLocation"
              name="location"
              type="text"
              maxlength="200"
              placeholder="e.g. Bhopal"
            >

          </div>

        </div>


        <div
          class="row"
          style="
            margin-top:4px;
          "
        >

          <button
            type="submit"
            class="btn btn-primary"
          >
            Search Work
          </button>

          <button
            type="button"
            id="resetWorkFilters"
            class="btn btn-light"
          >
            Reset
          </button>

        </div>

      </form>

    </div>


    <!--
    ========================================
    RESULTS SUMMARY
    ========================================
    -->

    <div
      class="row between"
      style="
        margin-bottom:14px;
      "
    >

      <div>

        <strong id="workResultsTitle">
          Available Work
        </strong>

        <p
          id="workResultsSummary"
          class="muted"
          style="
            margin:4px 0 0;
          "
        >
          Loading work requests...
        </p>

      </div>

    </div>


    <!--
    ========================================
    JOB LIST
    ========================================
    -->

    <div
      id="jobsList"
      class="list"
    ></div>


    <!--
    ========================================
    PAGINATION
    ========================================
    -->

    <div
      id="workPagination"
      class="row between"
      style="
        margin-top:20px;
        display:none;
      "
    >

      <button
        type="button"
        id="workPrevious"
        class="btn btn-light"
      >
        ← Previous
      </button>

      <span
        id="workPageInfo"
        class="muted"
      >
        Page 1
      </span>

      <button
        type="button"
        id="workNext"
        class="btn btn-primary"
      >
        Next →
      </button>

    </div>

  </div>

</section>

  </main>  <footer class="footer"><div class="container">

  <p>
